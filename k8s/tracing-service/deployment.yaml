apiVersion: apps/v1
kind: Deployment
metadata:
  name: toskamesh-tracing-service
  labels:
    app.kubernetes.io/name: toskamesh
    app.kubernetes.io/instance: toskamesh
    app.kubernetes.io/component: tracing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toskamesh
      app.kubernetes.io/instance: toskamesh
      app.kubernetes.io/component: tracing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toskamesh
        app.kubernetes.io/instance: toskamesh
        app.kubernetes.io/component: tracing-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tracing-service
        image: talos:30500/toskamesh-tracing-service:local-20251229
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: Consul__Address
          valueFrom:
            configMapKeyRef:
              name: toskamesh-tracing-service-config
              key: consul_address
        - name: Mesh__ServiceDiscovery__Grpc__Address
          valueFrom:
            configMapKeyRef:
              name: toskamesh-tracing-service-config
              key: discovery_grpc_address
        - name: Mesh__Telemetry__TracingIngest__Enabled
          value: "true"
        - name: Mesh__Telemetry__TracingIngest__Endpoint
          value: "http://toskamesh-tracing-service:8080/api/traces/ingest"
        - name: Mesh__Telemetry__Sampling__Strategy
          value: "ParentBasedAlwaysOn"
        - name: Mesh__Telemetry__Sampling__Ratio
          value: "1"
        - name: Mesh__Telemetry__ServiceNamespace
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: toskamesh-tracing-service-secrets
              key: db_connection_string
        - name: Database__AutoMigrate
          value: "true"
        - name: Mesh__ServiceAuth__Secret
          valueFrom:
            secretKeyRef:
              name: toskamesh-tracing-service-secrets
              key: mesh_service_auth_secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
