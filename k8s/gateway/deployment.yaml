apiVersion: apps/v1
kind: Deployment
metadata:
  name: toskamesh-gateway
  labels:
    app.kubernetes.io/name: toskamesh
    app.kubernetes.io/instance: toskamesh
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toskamesh
      app.kubernetes.io/instance: toskamesh
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toskamesh
        app.kubernetes.io/instance: toskamesh
        app.kubernetes.io/component: gateway
      annotations:
        sidecar.istio.io/inject: "true"
        traffic.sidecar.istio.io/includeInboundPorts: "*"
        security.istio.io/tlsMode: "istio"
    spec:
      containers:
      - name: gateway
        image: 192.168.50.3:30500/toskamesh-gateway:latest
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8443
          name: https
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: Urls
          value: "http://+:8080"
        - name: ASPNETCORE_Kestrel__Endpoints__Http__Url
          value: "http://+:8080"
        - name: Consul__Address
          valueFrom:
            configMapKeyRef:
              name: toskamesh-gateway-config
              key: consul_address
        - name: Mesh__ServiceDiscovery__Grpc__Address
          valueFrom:
            configMapKeyRef:
              name: toskamesh-gateway-config
              key: discovery_grpc_address
        - name: Mesh__ServiceDiscovery__Grpc__AllowInsecureTransport
          value: "false"
        - name: Mesh__ServiceDiscovery__Grpc__ClientCertificatePath
          value: "/etc/tls/client.pfx"
        - name: Mesh__ServiceDiscovery__Grpc__ClientCertificatePassword
          valueFrom:
            secretKeyRef:
              name: toskamesh-mtls
              key: client_pfx_password
              optional: true
        - name: Mesh__Telemetry__TracingIngest__Enabled
          value: "true"
        - name: Mesh__Telemetry__TracingIngest__Endpoint
          value: "http://toskamesh-tracing-service:8080/api/traces/ingest"
        - name: Mesh__Telemetry__Sampling__Strategy
          value: "ParentBasedAlwaysOn"
        - name: Mesh__Telemetry__Sampling__Ratio
          value: "1"
        - name: Jwt__SecretKey
          valueFrom:
            secretKeyRef:
              name: toskamesh-gateway-secrets
              key: jwt_secret_key
        - name: SSL_CERT_FILE
          value: "/etc/tls/ca.crt"
        - name: Mesh__Gateway__Tls__ClientCertificatePath
          value: "/etc/tls/gateway-client.pfx"
        - name: Mesh__Gateway__Tls__ClientCertificatePassword
          valueFrom:
            secretKeyRef:
              name: toskamesh-gateway-tls
              key: gateway_client_pfx_password
              optional: true
        - name: Mesh__ServiceAuth__Secret
          valueFrom:
            secretKeyRef:
              name: toskamesh-discovery-secrets
              key: mesh_service_auth_secret
        - name: ASPNETCORE_Kestrel__Endpoints__Https__Url
          valueFrom:
            secretKeyRef:
              name: toskamesh-gateway-tls
              key: kestrel_https_url
              optional: true
        - name: ASPNETCORE_Kestrel__Endpoints__Https__ClientCertificateMode
          value: "NoCertificate"
        - name: ASPNETCORE_Kestrel__Certificates__Default__Path
          valueFrom:
            secretKeyRef:
              name: toskamesh-gateway-tls
              key: gateway_server_pfx_path
              optional: true
        - name: ASPNETCORE_Kestrel__Certificates__Default__Password
          valueFrom:
            secretKeyRef:
              name: toskamesh-gateway-tls
              key: gateway_server_pfx_password
              optional: true
        - name: Mesh__Gateway__ForceHttpsRedirect
          value: "false"
        - name: Dashboard__PrometheusBaseUrl
          value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
        - name: Dashboard__TracingBaseUrl
          value: "http://toskamesh-tracing-service.toskamesh.svc.cluster.local:8080"
        - name: Dashboard__DiscoveryBaseUrl
          value: "http://toskamesh-discovery.toskamesh.svc.cluster.local:8080"
        - name: Dashboard__HealthMonitorBaseUrl
          value: "http://toskamesh-health-monitor.toskamesh.svc.cluster.local:8080"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: gateway-tls
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: gateway-tls
        secret:
          secretName: toskamesh-gateway-tls
          optional: true
