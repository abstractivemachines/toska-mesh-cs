apiVersion: apps/v1
kind: Deployment
metadata:
  name: toska-store
  labels:
    app.kubernetes.io/name: toska-store
    app.kubernetes.io/instance: toska-store
    app.kubernetes.io/component: example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toska-store
      app.kubernetes.io/instance: toska-store
      app.kubernetes.io/component: example
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toska-store
        app.kubernetes.io/instance: toska-store
        app.kubernetes.io/component: example
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toska-store
          image: talos:30500/toska-store:local
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: TOSKA_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: profile-kv-store-demo-secrets
                  key: toskaStoreAuthToken
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: toska-store-data
              mountPath: /data
      volumes:
        - name: toska-store-data
          emptyDir: {}
