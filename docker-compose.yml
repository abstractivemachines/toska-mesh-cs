services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: toksa_mesh
      POSTGRES_PASSWORD: toksa_mesh_password
      POSTGRES_DB: toksa_mesh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - toksa-mesh

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - toksa-mesh

  consul:
    image: consul:1.15
    ports:
      - "8500:8500"
      - "8600:8600"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    networks:
      - toksa-mesh

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - toksa-mesh

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - toksa-mesh

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - toksa-mesh

  # Control Plane (Go binaries from ../toska-mesh/)
  gateway:
    build:
      context: ../toska-mesh
      dockerfile: Dockerfile
      target: gateway
    ports:
      - "5000:8080"
    environment:
      - GATEWAY_PORT=8080
      - CONSUL_ADDRESS=http://consul:8500
      - JWT_SECRET_KEY=localdev-super-secret-key-0123456789-0123456789
      - DASHBOARD_PROMETHEUS_URL=http://prometheus:9090
      - DASHBOARD_TRACING_URL=http://tracing-service:8080
      - DASHBOARD_DISCOVERY_URL=http://discovery:8080
      - DASHBOARD_HEALTHMONITOR_URL=http://health-monitor:8080
    depends_on:
      - consul
      - discovery
      - prometheus
    networks:
      - toksa-mesh

  discovery:
    build:
      context: ../toska-mesh
      dockerfile: Dockerfile
      target: discovery
    ports:
      - "5010:8080"
    environment:
      - DISCOVERY_PORT=8080
      - CONSUL_ADDRESS=http://consul:8500
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - consul
      - rabbitmq
    networks:
      - toksa-mesh

  health-monitor:
    build:
      context: ../toska-mesh
      dockerfile: Dockerfile
      target: healthmonitor
    ports:
      - "5005:8080"
    environment:
      - HEALTHMONITOR_PORT=8080
      - CONSUL_ADDRESS=http://consul:8500
    depends_on:
      - discovery
      - consul
    networks:
      - toksa-mesh

  # Business Services
  auth-service:
    build:
      context: .
      dockerfile: deployments/Dockerfile.AuthService
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - Urls=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=toksa_mesh;Username=toksa_mesh;Password=toksa_mesh_password
      - Database__AutoMigrate=true
      - Consul__Address=http://consul:8500
      - Mesh__ServiceDiscovery__Grpc__Address=http://discovery:8080
      - Mesh__ServiceAuth__Secret=localdev-super-secret-key-0123456789-0123456789
      - Mesh__Telemetry__TracingIngest__Enabled=true
      - Mesh__Telemetry__TracingIngest__Endpoint=http://tracing-service:8080/api/traces/ingest
      - Mesh__Telemetry__Sampling__Strategy=ParentBasedAlwaysOn
      - Mesh__Telemetry__Sampling__Ratio=1
    depends_on:
      - postgres
      - consul
      - discovery
    networks:
      - toksa-mesh

  config-service:
    build:
      context: .
      dockerfile: deployments/Dockerfile.ConfigService
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - Urls=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=toksa_mesh;Username=toksa_mesh;Password=toksa_mesh_password
      - Database__AutoMigrate=true
      - Consul__Address=http://consul:8500
      - Mesh__ServiceDiscovery__Grpc__Address=http://discovery:8080
      - Jwt__Secret=localdev-super-secret-key-0123456789-0123456789
      - Mesh__ServiceAuth__Secret=localdev-super-secret-key-0123456789-0123456789
      - Mesh__Telemetry__TracingIngest__Enabled=true
      - Mesh__Telemetry__TracingIngest__Endpoint=http://tracing-service:8080/api/traces/ingest
      - Mesh__Telemetry__Sampling__Strategy=ParentBasedAlwaysOn
      - Mesh__Telemetry__Sampling__Ratio=1
    depends_on:
      - postgres
      - consul
      - discovery
    networks:
      - toksa-mesh

  metrics-service:
    build:
      context: .
      dockerfile: deployments/Dockerfile.MetricsService
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - Urls=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=toksa_mesh;Username=toksa_mesh;Password=toksa_mesh_password
      - Database__AutoMigrate=true
      - Consul__Address=http://consul:8500
      - Mesh__ServiceDiscovery__Grpc__Address=http://discovery:8080
      - Jwt__Secret=localdev-super-secret-key-0123456789-0123456789
      - Mesh__ServiceAuth__Secret=localdev-super-secret-key-0123456789-0123456789
      - Mesh__Telemetry__TracingIngest__Enabled=true
      - Mesh__Telemetry__TracingIngest__Endpoint=http://tracing-service:8080/api/traces/ingest
      - Mesh__Telemetry__Sampling__Strategy=ParentBasedAlwaysOn
      - Mesh__Telemetry__Sampling__Ratio=1
    depends_on:
      - postgres
      - prometheus
      - consul
      - discovery
    networks:
      - toksa-mesh

  tracing-service:
    build:
      context: .
      dockerfile: deployments/Dockerfile.TracingService
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - Urls=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=toksa_mesh;Username=toksa_mesh;Password=toksa_mesh_password
      - Database__AutoMigrate=true
      - Consul__Address=http://consul:8500
      - Mesh__ServiceDiscovery__Grpc__Address=http://discovery:8080
      - Jwt__Secret=localdev-super-secret-key-0123456789-0123456789
      - Mesh__ServiceAuth__Secret=localdev-super-secret-key-0123456789-0123456789
      - Mesh__Telemetry__TracingIngest__Enabled=true
      - Mesh__Telemetry__TracingIngest__Endpoint=http://tracing-service:8080/api/traces/ingest
      - Mesh__Telemetry__Sampling__Strategy=ParentBasedAlwaysOn
      - Mesh__Telemetry__Sampling__Ratio=1
    depends_on:
      - postgres
      - consul
      - discovery
    networks:
      - toksa-mesh

networks:
  toksa-mesh:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
