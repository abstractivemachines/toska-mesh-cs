service:
  name: adder-mesh-service
  type: stateless

deploy:
  target: kubernetes
  namespace: toskamesh-example

workloads:
  - name: adder-mesh-service
    type: stateless
    manifests:
      - ../../k8s/adder-mesh-service/service.yaml
      - ../../k8s/adder-mesh-service/deployment.yaml
    image:
      repository: adder-mesh-service
      tag: local
      registry: talos:30500
    build:
      context: ../..
      dockerfile: Dockerfile
    portForward:
      service: adder-mesh-service
      port: 8083
      localPort: 8083
