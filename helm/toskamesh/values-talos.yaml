# Talos / single-node on-prem values (local registry + NodePort gateway)

environment: Development

# Global secrets (replace with strong values)
global:
  meshServiceAuthSecret: "ToskaMesh-Dev-Secret-32-Chars-Min"
  jwtSecret: "ToskaMesh-Dev-JWT-Secret-32-Chars"

telemetry:
  sampling:
    strategy: "ParentBasedAlwaysOn"
    ratio: 1.0
  tracingIngest:
    enabled: true
    endpoint: ""
    headers: {}

externalServices:
  consul:
    address: "http://consul-server.toskamesh-infra.svc.cluster.local:8500"
  postgres:
    host: "postgres-postgresql.toskamesh-infra.svc.cluster.local"
    port: 5432
    database: "toksa_mesh"
    username: "toksa_mesh"
    password: "toksa_mesh_password"
  rabbitmq:
    host: "rabbitmq.toskamesh-infra.svc.cluster.local"
    port: 5672
    username: "guest"
    password: "guest"
  redis:
    host: "redis-master.toskamesh-infra.svc.cluster.local"
    port: 6379

database:
  autoMigrate: true

# Point all services at the local registry on the laptop (adjust if your host IP changes)
registry: "talos:30500"
tag: "v2.0.0"

gateway:
  replicaCount: 1
  image:
    repository: "talos:30500/toskamesh-gateway"
    tag: "v2.0.3"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  ingress:
    enabled: false
  secrets:
    jwtSecretKey: "ToskaMesh-Dev-JWT-Secret-32-Chars"

discovery:
  replicaCount: 1
  image:
    repository: "talos:30500/toskamesh-discovery"
    tag: "v2.0.0"
    pullPolicy: IfNotPresent

authService:
  replicaCount: 1
  image:
    repository: "talos:30500/toskamesh-auth-service"
    tag: "v2.0.0"
    pullPolicy: IfNotPresent

configService:
  replicaCount: 1
  image:
    repository: "talos:30500/toskamesh-config-service"
    tag: "v2.0.0"
    pullPolicy: IfNotPresent

metricsService:
  replicaCount: 1
  image:
    repository: "talos:30500/toskamesh-metrics-service"
    tag: "v2.0.0"
    pullPolicy: IfNotPresent

tracingService:
  replicaCount: 1
  image:
    repository: "talos:30500/toskamesh-tracing-service"
    tag: "v2.0.1"
    pullPolicy: IfNotPresent
  queryDefaults:
    enableDefaultLookback: true
    defaultLookbackHours: 24
    totalTimeoutSeconds: 5
    includeTotalCounts: false
  summaryRefresh:
    enabled: true
    refreshIntervalSeconds: 60
    refreshConcurrently: true
    commandTimeoutSeconds: 300
  retention:
    enabled: true
    retentionDays: 7
    cleanupIntervalMinutes: 5
    batchSize: 50000

observabilityService:
  replicaCount: 1
  image:
    repository: "talos:30500/toskamesh-observability-service"
    tag: "v2.0.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30082

core:
  enabled: false

healthMonitor:
  replicaCount: 1
  image:
    repository: "talos:30500/toskamesh-health-monitor"
    tag: "v2.0.0"
    pullPolicy: IfNotPresent
  probeInterval: 30
  httpTimeout: 5
  tcpTimeout: 3
  failureThreshold: 3
