# Talos / single-node on-prem values (local registry + NodePort gateway)

environment: Development

# Global secrets (replace with strong values)
global:
  meshServiceAuthSecret: "ToskaMesh-Dev-Secret-32-Chars-Min"
  jwtSecret: "ToskaMesh-Dev-JWT-Secret-32-Chars"

serviceDiscovery:
  grpc:
    allowInsecureTransport: true

telemetry:
  sampling:
    strategy: "ParentBasedAlwaysOn"
    ratio: 1.0
  tracingIngest:
    enabled: true
    endpoint: ""
    headers: {}

externalServices:
  consul:
    address: "http://consul-server.toskamesh-infra.svc.cluster.local:8500"
  postgres:
    host: "postgres-postgresql.toskamesh-infra.svc.cluster.local"
    port: 5432
    database: "toksa_mesh"
    username: "toksa_mesh"
    password: "toksa_mesh_password"
  rabbitmq:
    host: "rabbitmq.toskamesh-infra.svc.cluster.local"
    port: 5672
    username: "guest"
    password: "guest"
  redis:
    host: "redis-master.toskamesh-infra.svc.cluster.local"
    port: 6379

database:
  autoMigrate: true

# Point all services at the local registry on the laptop (adjust if your host IP changes)
registry: "192.168.50.73:5000"
tag: "local"

gateway:
  replicaCount: 1
  image:
    repository: "192.168.50.73:5000/toskamesh-gateway"
    tag: "v1.3.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  ingress:
    enabled: false
  secrets:
    jwtSecretKey: "ToskaMesh-Dev-JWT-Secret-32-Chars"

dashboard:
  replicaCount: 1
  image:
    repository: "192.168.50.73:5000/toskamesh-dashboard"
    tag: "v2.9.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30081
  ingress:
    enabled: false
  gatewayBaseUrl: "http://talos:30080"

discovery:
  replicaCount: 1
  image:
    repository: "192.168.50.73:5000/toskamesh-discovery"
    tag: "v1.2.0"
    pullPolicy: IfNotPresent

authService:
  replicaCount: 1
  image:
    repository: "192.168.50.73:5000/toskamesh-auth-service"
    tag: "local"
    pullPolicy: IfNotPresent

configService:
  replicaCount: 1
  image:
    repository: "192.168.50.73:5000/toskamesh-config-service"
    tag: "local"
    pullPolicy: IfNotPresent

metricsService:
  replicaCount: 1
  image:
    repository: "192.168.50.73:5000/toskamesh-metrics-service"
    tag: "v1.1.0"
    pullPolicy: IfNotPresent

tracingService:
  replicaCount: 1
  image:
    repository: "192.168.50.73:5000/toskamesh-tracing-service"
    tag: "v1.3.0"
    pullPolicy: IfNotPresent

core:
  replicaCount: 1
  image:
    repository: "192.168.50.73:5000/toskamesh-core"
    tag: "local"
    pullPolicy: IfNotPresent
  orleans:
    serviceId: "ToskaMesh-Local"
    clusterId: "talos-local"
    clusterProvider: "Consul"

healthMonitor:
  replicaCount: 1
  image:
    repository: "192.168.50.73:5000/toskamesh-health-monitor"
    tag: "v1.1.0"
    pullPolicy: IfNotPresent
