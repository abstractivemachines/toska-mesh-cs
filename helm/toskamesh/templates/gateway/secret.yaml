{{- if and .Values.gateway.enabled (or (not .Values.secrets.gatewayJwt.existingSecret) (not .Values.secrets.meshServiceAuth.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "toskamesh.fullname" . }}-gateway-secrets
  labels:
    {{- include "toskamesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  {{- if not .Values.secrets.gatewayJwt.existingSecret }}
  {{ default "jwt_secret_key" .Values.secrets.gatewayJwt.key }}: {{ .Values.gateway.secrets.jwtSecretKey | quote }}
  {{- end }}
  {{- if not .Values.secrets.meshServiceAuth.existingSecret }}
  {{ default "mesh_service_auth_secret" .Values.secrets.meshServiceAuth.key }}: {{ .Values.global.meshServiceAuthSecret | quote }}
  {{- end }}
{{- end }}
