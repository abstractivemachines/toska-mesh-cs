{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toskamesh.fullname" . }}-gateway
  labels:
    {{- include "toskamesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "toskamesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "toskamesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      {{- if .Values.mesh.enabled }}
      annotations:
        {{- with .Values.mesh.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - name: gateway
        image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: GATEWAY_PORT
          value: "8080"
        - name: CONSUL_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-config
              key: consul_address
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ default (printf "%s-gateway-secrets" (include "toskamesh.fullname" .)) .Values.secrets.gatewayJwt.existingSecret }}
              key: {{ default "jwt_secret_key" .Values.secrets.gatewayJwt.key }}
        - name: JWT_ISSUER
          value: {{ default "ToskaMesh.Gateway" .Values.gateway.jwtIssuer | quote }}
        - name: JWT_AUDIENCE
          value: {{ default "ToskaMesh.Services" .Values.gateway.jwtAudience | quote }}
        - name: DASHBOARD_PROMETHEUS_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-config
              key: dashboard_prometheus_url
        - name: DASHBOARD_TRACING_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-config
              key: dashboard_tracing_url
        - name: DASHBOARD_DISCOVERY_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-config
              key: dashboard_discovery_url
        - name: DASHBOARD_HEALTHMONITOR_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-config
              key: dashboard_healthmonitor_url
        - name: MESH_SERVICE_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-secrets
              key: mesh_service_auth_secret
        resources:
          {{- toYaml .Values.gateway.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
{{- end }}
