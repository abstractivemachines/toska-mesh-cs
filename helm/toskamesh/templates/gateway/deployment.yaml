{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toskamesh.fullname" . }}-gateway
  labels:
    {{- include "toskamesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "toskamesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "toskamesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      {{- if .Values.mesh.enabled }}
      annotations:
        {{- with .Values.mesh.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - name: gateway
        image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: {{ .Values.environment }}
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: Urls
          value: "http://+:8080"
        - name: Consul__Address
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-config
              key: consul_address
        - name: Mesh__ServiceDiscovery__Grpc__Address
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-config
              key: discovery_grpc_address
        - name: Mesh__ServiceDiscovery__Grpc__AllowInsecureTransport
          value: {{ .Values.serviceDiscovery.grpc.allowInsecureTransport | quote }}
        - name: Mesh__ServiceDiscovery__Grpc__ClientCertificatePath
          value: "/etc/tls/client.pfx"
        - name: Mesh__ServiceDiscovery__Grpc__ClientCertificatePassword
          valueFrom:
            secretKeyRef:
              name: {{ include "toskamesh.fullname" . }}-mtls
              key: client_pfx_password
              optional: true
        - name: Dashboard__PrometheusBaseUrl
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-config
              key: dashboard_prometheus_base_url
        - name: Dashboard__TracingBaseUrl
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-config
              key: dashboard_tracing_base_url
        - name: Dashboard__DiscoveryBaseUrl
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-config
              key: dashboard_discovery_base_url
        - name: Dashboard__HealthMonitorBaseUrl
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-gateway-config
              key: dashboard_health_base_url
        - name: Mesh__Telemetry__TracingIngest__Enabled
          value: {{ default false .Values.telemetry.tracingIngest.enabled | quote }}
        - name: Mesh__Telemetry__TracingIngest__Endpoint
          value: {{ default (printf "http://%s-tracing-service:8080/api/traces/ingest" (include "toskamesh.fullname" .)) .Values.telemetry.tracingIngest.endpoint | quote }}
        - name: Mesh__Telemetry__Sampling__Strategy
          value: {{ default "ParentBasedAlwaysOn" .Values.telemetry.sampling.strategy | quote }}
        - name: Mesh__Telemetry__Sampling__Ratio
          value: {{ default 1.0 .Values.telemetry.sampling.ratio | quote }}
        - name: Mesh__Telemetry__ServiceNamespace
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SSL_CERT_FILE
          value: "/etc/tls/ca.crt"
        {{- with .Values.telemetry.tracingIngest.headers }}
        {{- range $name, $value := . }}
        - name: Mesh__Telemetry__TracingIngest__Headers__{{ $name }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        - name: Jwt__SecretKey
          valueFrom:
            secretKeyRef:
              name: {{ default (printf "%s-gateway-secrets" (include "toskamesh.fullname" .)) .Values.secrets.gatewayJwt.existingSecret }}
              key: {{ default "jwt_secret_key" .Values.secrets.gatewayJwt.key }}
        - name: Mesh__ServiceAuth__Secret
          valueFrom:
            secretKeyRef:
              name: {{ default (printf "%s-gateway-secrets" (include "toskamesh.fullname" .)) .Values.secrets.meshServiceAuth.existingSecret }}
              key: {{ default "mesh_service_auth_secret" .Values.secrets.meshServiceAuth.key }}
        resources:
          {{- toYaml .Values.gateway.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: mesh-tls
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: mesh-tls
        secret:
          secretName: {{ include "toskamesh.fullname" . }}-mtls
{{- end }}
