{{- if .Values.observabilityService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "toskamesh.fullname" . }}-observability-service
  labels:
    {{- include "toskamesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability-service
spec:
  type: {{ .Values.observabilityService.service.type }}
  ports:
  - port: {{ .Values.observabilityService.service.port }}
    targetPort: 8080
    protocol: TCP
    name: http
    {{- if and (eq .Values.observabilityService.service.type "NodePort") .Values.observabilityService.service.nodePort }}
    nodePort: {{ .Values.observabilityService.service.nodePort }}
    {{- end }}
  selector:
    {{- include "toskamesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: observability-service
{{- end }}
