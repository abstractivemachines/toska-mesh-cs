{{- if .Values.tracingService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toskamesh.fullname" . }}-tracing-service
  labels:
    {{- include "toskamesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracing-service
spec:
  replicas: {{ .Values.tracingService.replicaCount }}
  selector:
    matchLabels:
      {{- include "toskamesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tracing-service
  template:
    metadata:
      labels:
        {{- include "toskamesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tracing-service
      {{- if .Values.mesh.enabled }}
      annotations:
        {{- with .Values.mesh.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- if .Values.tracingService.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.tracingService.podSecurityContext | nindent 8 }}
      {{- else if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - name: tracing-service
        image: "{{ .Values.tracingService.image.repository }}:{{ .Values.tracingService.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.tracingService.image.pullPolicy }}
        {{- if .Values.tracingService.containerSecurityContext }}
        securityContext:
          {{- toYaml .Values.tracingService.containerSecurityContext | nindent 10 }}
        {{- else if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: {{ .Values.environment }}
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: Consul__Address
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-tracing-service-config
              key: consul_address
        - name: Mesh__ServiceDiscovery__Grpc__Address
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-tracing-service-config
              key: discovery_grpc_address
        - name: Tracing__QueryDefaults__EnableDefaultLookback
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-tracing-service-config
              key: tracing_query_default_lookback_enabled
        - name: Tracing__QueryDefaults__DefaultLookbackHours
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-tracing-service-config
              key: tracing_query_default_lookback_hours
        - name: Tracing__QueryDefaults__TotalTimeoutSeconds
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-tracing-service-config
              key: tracing_query_total_timeout_seconds
        - name: Tracing__QueryDefaults__IncludeTotalCounts
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-tracing-service-config
              key: tracing_query_include_total_counts
        - name: Tracing__SummaryRefresh__Enabled
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-tracing-service-config
              key: tracing_summary_refresh_enabled
        - name: Tracing__SummaryRefresh__RefreshIntervalSeconds
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-tracing-service-config
              key: tracing_summary_refresh_interval_seconds
        - name: Tracing__SummaryRefresh__RefreshConcurrently
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-tracing-service-config
              key: tracing_summary_refresh_concurrently
        - name: Tracing__SummaryRefresh__CommandTimeoutSeconds
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-tracing-service-config
              key: tracing_summary_refresh_command_timeout_seconds
        - name: Mesh__Telemetry__TracingIngest__Enabled
          value: {{ default false .Values.telemetry.tracingIngest.enabled | quote }}
        - name: Mesh__Telemetry__TracingIngest__Endpoint
          value: {{ default (printf "http://%s-tracing-service:8080/api/traces/ingest" (include "toskamesh.fullname" .)) .Values.telemetry.tracingIngest.endpoint | quote }}
        - name: Mesh__Telemetry__Sampling__Strategy
          value: {{ default "ParentBasedAlwaysOn" .Values.telemetry.sampling.strategy | quote }}
        - name: Mesh__Telemetry__Sampling__Ratio
          value: {{ default 1.0 .Values.telemetry.sampling.ratio | quote }}
        - name: Mesh__Telemetry__ServiceNamespace
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- with .Values.telemetry.tracingIngest.headers }}
        {{- range $name, $value := . }}
        - name: Mesh__Telemetry__TracingIngest__Headers__{{ $name }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: {{ default (printf "%s-tracing-service-secrets" (include "toskamesh.fullname" .)) .Values.secrets.defaultConnection.existingSecret }}
              key: {{ default "db_connection_string" .Values.secrets.defaultConnection.key }}
        - name: Database__AutoMigrate
          value: {{ default false .Values.database.autoMigrate | quote }}
        - name: Mesh__ServiceAuth__Secret
          valueFrom:
            secretKeyRef:
              name: {{ default (printf "%s-tracing-service-secrets" (include "toskamesh.fullname" .)) .Values.secrets.meshServiceAuth.existingSecret }}
              key: {{ default "mesh_service_auth_secret" .Values.secrets.meshServiceAuth.key }}
        resources:
          {{- toYaml .Values.tracingService.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 5
{{- end }}
