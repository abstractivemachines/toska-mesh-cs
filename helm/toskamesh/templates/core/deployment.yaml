{{- if .Values.core.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toskamesh.fullname" . }}-core
  labels:
    {{- include "toskamesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  replicas: {{ .Values.core.replicaCount }}
  selector:
    matchLabels:
      {{- include "toskamesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        {{- include "toskamesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core
      {{- if .Values.mesh.enabled }}
      annotations:
        {{- with .Values.mesh.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - name: core
        image: "{{ .Values.core.image.repository }}:{{ .Values.core.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.core.image.pullPolicy }}
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 11111
          name: silo
        - containerPort: 30000
          name: gateway
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: {{ .Values.environment }}
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: Orleans__ServiceId
          value: {{ default .Values.core.orleans.serviceName .Values.core.orleans.serviceId | quote }}
        - name: Orleans__ClusterId
          value: {{ .Values.core.orleans.clusterId | quote }}
        - name: Orleans__ClusterProvider
          value: {{ .Values.core.orleans.clusterProvider | quote }}
        - name: Orleans__ConsulAddress
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-core-config
              key: consul_address
        - name: Orleans__AdvertisedIPAddress
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: Consul__Address
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-core-config
              key: consul_address
        - name: Orleans__DatabaseConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ default (printf "%s-core-secrets" (include "toskamesh.fullname" .)) .Values.secrets.defaultConnection.existingSecret }}
              key: {{ default "db_connection_string" .Values.secrets.defaultConnection.key }}
        - name: Mesh__ServiceAuth__Secret
          valueFrom:
            secretKeyRef:
              name: {{ default (printf "%s-core-secrets" (include "toskamesh.fullname" .)) .Values.secrets.meshServiceAuth.existingSecret }}
              key: {{ default "mesh_service_auth_secret" .Values.secrets.meshServiceAuth.key }}
        resources:
          {{- toYaml .Values.core.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: 11111
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 11111
          initialDelaySeconds: 20
          periodSeconds: 5
{{- end }}
