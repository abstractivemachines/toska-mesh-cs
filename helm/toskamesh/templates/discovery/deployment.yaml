{{- if .Values.discovery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toskamesh.fullname" . }}-discovery
  labels:
    {{- include "toskamesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: discovery
spec:
  replicas: {{ .Values.discovery.replicaCount }}
  selector:
    matchLabels:
      {{- include "toskamesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: discovery
  template:
    metadata:
      labels:
        {{- include "toskamesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: discovery
      {{- if .Values.mesh.enabled }}
      annotations:
        {{- with .Values.mesh.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - name: discovery
        image: "{{ .Values.discovery.image.repository }}:{{ .Values.discovery.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.discovery.image.pullPolicy }}
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: {{ .Values.environment }}
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: Urls
          value: "http://+:8080"
        - name: Consul__Address
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-discovery-config
              key: consul_address
        - name: Messaging__RabbitMqHost
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-discovery-config
              key: rabbitmq_host
        - name: Messaging__RabbitMqUsername
          valueFrom:
            secretKeyRef:
              name: {{ include "toskamesh.fullname" . }}-discovery-secrets
              key: rabbitmq_username
        - name: Messaging__RabbitMqPassword
          valueFrom:
            secretKeyRef:
              name: {{ include "toskamesh.fullname" . }}-discovery-secrets
              key: rabbitmq_password
        - name: Mesh__ServiceAuth__Secret
          valueFrom:
            secretKeyRef:
              name: {{ default (printf "%s-discovery-secrets" (include "toskamesh.fullname" .)) .Values.secrets.meshServiceAuth.existingSecret }}
              key: {{ default "mesh_service_auth_secret" .Values.secrets.meshServiceAuth.key }}
        resources:
          {{- toYaml .Values.discovery.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
{{- end }}
