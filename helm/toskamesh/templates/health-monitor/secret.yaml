{{- if .Values.healthMonitor.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "toskamesh.fullname" . }}-health-monitor-secrets
  labels:
    {{- include "toskamesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: health-monitor
type: Opaque
stringData:
  rabbitmq_url: "amqp://{{ .Values.externalServices.rabbitmq.username }}:{{ .Values.externalServices.rabbitmq.password }}@{{ include "toskamesh.rabbitmq.host" . }}:{{ .Values.externalServices.rabbitmq.port }}"
{{- end }}
