{{- if .Values.healthMonitor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toskamesh.fullname" . }}-health-monitor
  labels:
    {{- include "toskamesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: health-monitor
spec:
  replicas: {{ .Values.healthMonitor.replicaCount }}
  selector:
    matchLabels:
      {{- include "toskamesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: health-monitor
  template:
    metadata:
      labels:
        {{- include "toskamesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: health-monitor
      {{- if .Values.mesh.enabled }}
      annotations:
        {{- with .Values.mesh.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - name: health-monitor
        image: "{{ .Values.healthMonitor.image.repository }}:{{ .Values.healthMonitor.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.healthMonitor.image.pullPolicy }}
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: HEALTHMONITOR_PORT
          value: "8080"
        - name: CONSUL_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: {{ include "toskamesh.fullname" . }}-health-monitor-config
              key: consul_address
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "toskamesh.fullname" . }}-health-monitor-secrets
              key: rabbitmq_url
        - name: HEALTHMONITOR_PROBE_INTERVAL_SECONDS
          value: {{ default 30 .Values.healthMonitor.probeInterval | quote }}
        - name: HEALTHMONITOR_HTTP_TIMEOUT_SECONDS
          value: {{ default 5 .Values.healthMonitor.httpTimeout | quote }}
        - name: HEALTHMONITOR_TCP_TIMEOUT_SECONDS
          value: {{ default 3 .Values.healthMonitor.tcpTimeout | quote }}
        - name: HEALTHMONITOR_FAILURE_THRESHOLD
          value: {{ default 3 .Values.healthMonitor.failureThreshold | quote }}
        resources:
          {{- toYaml .Values.healthMonitor.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
{{- end }}
